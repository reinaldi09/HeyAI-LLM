name: pharma-rag

services:

  # Database
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: pharma-db
    restart: unless-stopped
    ports:
      - "2345:5432"
    environment:
      POSTGRES_DB: pharmadb
      POSTGRES_USER: pharma
      POSTGRES_PASSWORD: ph4rmaPo5gr3ssP4ssw0rd
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharma -d pharmadb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend
  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: pharma-backend
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ./be/.env.development
    volumes:
      - ./storage/backend/vector_db:/app/vector_db
      - ./storage/backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=5)\""
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Frontend
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_PREFIX: /api
    container_name: pharma-frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy

  # Reverse proxy
  nginx:
    image: docker.io/library/nginx:1.27-alpine
    container_name: pharma-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/conf.d/proxy_params.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
