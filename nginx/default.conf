limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=captcha_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=rag_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=patient_search_limit:10m rate=60r/m;

map $request_method $document_write_limit_key {
    default "";
    POST $binary_remote_addr;
    PUT $binary_remote_addr;
    DELETE $binary_remote_addr;
}

limit_req_zone $document_write_limit_key zone=document_write_limit:10m rate=8r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 100m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000/auth/login;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location = /api/auth/captcha {
        limit_req zone=captcha_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000/auth/captcha;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location = /api/pharma-assessment {
        limit_req zone=rag_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000/pharma-assessment;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location = /api/documents {
        limit_req zone=document_write_limit burst=4 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000/documents;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location ^~ /api/documents/ {
        limit_req zone=document_write_limit burst=4 nodelay;
        limit_req_status 429;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location = /api/pasien/search {
        limit_req zone=patient_search_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000/pasien/search;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /api/ {
        limit_req zone=api_general_limit burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000/;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location / {
        proxy_pass http://frontend:3000;
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
